[project]
name = "ai-engine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "diffusers>=0.38.0",
    "fastapi>=0.138.0",
    "huggingface-hub>=1.20.1",
    "pillow>=11.0.0",
    # FLUX uses a T5 text encoder whose tokenizer needs sentencepiece + protobuf.
    "protobuf>=4.25.0",
    "sentencepiece>=0.2.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "torchvision>=0.20.0",
    "uvicorn[standard]>=0.49.0",
    "optimum-quanto>=0.2.7",
    # 4-bit (nf4) quantization for FLUX so it fits on small CUDA GPUs. CUDA-only;
    # the engine only uses it when running on CUDA (see THORIUM_AI_FLUX_QUANTIZE).
    "bitsandbytes>=0.49.2 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
